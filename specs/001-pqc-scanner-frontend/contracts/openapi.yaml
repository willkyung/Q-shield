openapi: 3.0.0
info:
  title: AI-PQC Scanner Backend API
  version: 1.0.0
  description: API for the AI-PQC Scanner Frontend to interact with the backend scanner engine.

servers:
  - url: /api
    description: Base URL for the API

paths:
  /scans:
    post:
      summary: Initiate a new PQC scan
      operationId: initiateScan
      requestBody:
        description: GitHub repository URL to scan
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                github_url:
                  type: string
                  format: url
                  description: The GitHub repository URL to be scanned.
              required:
                - github_url
      responses:
        '200':
          description: Scan initiation accepted. Returns the UUID of the new scan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    format: uuid
                    description: Unique identifier for the initiated scan.
                  status:
                    type: string
                    enum: [QUEUED, RUNNING, COMPLETED, FAILED]
                    description: Current status of the scan.
        '400':
          description: Invalid GitHub URL provided.
        '500':
          description: Internal server error.

  /scans/{uuid}/status:
    get:
      summary: Get the current status of a PQC scan
      operationId: getScanStatus
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
            format: uuid
          required: true
          description: UUID of the scan to retrieve status for.
      responses:
        '200':
          description: Current scan status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [QUEUED, RUNNING, COMPLETED, FAILED]
                    description: Current status of the scan.
                  progress:
                    type: number
                    format: float
                    minimum: 0
                    maximum: 1
                    description: Fractional scan completion (0.0-1.0).
                  message:
                    type: string
                    description: Human-readable progress message.
        '404':
          description: Scan not found.
        '500':
          description: Internal server error.

  /scans/{uuid}/inventory:
    get:
      summary: Get cryptographic asset inventory for a scan
      operationId: getScanInventory
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
            format: uuid
          required: true
          description: UUID of the scan to retrieve inventory for.
      responses:
        '200':
          description: List of cryptographic assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '404':
          description: Scan not found.
        '500':
          description: Internal server error.

  /scans/{uuid}/heatmap:
    get:
      summary: Get repository heatmap data for a scan
      operationId: getScanHeatmap
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
            format: uuid
          required: true
          description: UUID of the scan to retrieve heatmap for.
      responses:
        '200':
          description: File system risk heatmap data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeatmapNode'
        '404':
          description: Scan not found.
        '500':
          description: Internal server error.

  /scans/{uuid}/recommendations:
    get:
      summary: Get PQC recommendations for a scan
      operationId: getPQCRecommendations
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
            format: uuid
          required: true
          description: UUID of the scan to retrieve recommendations for.
        - in: query
          name: algorithm
          schema:
            type: string
          description: Optional filter for cryptographic algorithm type (e.g., RSA, ECC).
        - in: query
          name: context
          schema:
            type: string
          description: Optional filter for contextual information (e.g., payment logic).
      responses:
        '200':
          description: List of PQC recommendations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recommendation'
        '404':
          description: Scan not found.
        '500':
          description: Internal server error.

components:
  schemas:
    AlgorithmRatio:
      type: object
      properties:
        name:
          type: string
          description: Type of cryptographic algorithm (e.g., ECC, AES, RSA).
        ratio:
          type: number
          format: float
          description: Ratio of the algorithm usage (0.0-1.0).
      required: [name, ratio]

    InventoryTableItem:
      type: object
      properties:
        algorithm:
          type: string
          description: Type of cryptographic algorithm (e.g., ECC, AES, RSA).
        count:
          type: integer
          description: Occurrence count for the algorithm.
        locations:
          type: array
          items:
            type: string
          description: List of file paths and line numbers.
      required: [algorithm, count, locations]

    InventoryResponse:
      type: object
      properties:
        pqc_readiness_score:
          type: number
          format: float
          description: Overall PQC readiness score (0.0-10.0).
        algorithm_ratios:
          type: array
          items:
            $ref: '#/components/schemas/AlgorithmRatio'
        inventory_table:
          type: array
          items:
            $ref: '#/components/schemas/InventoryTableItem'
      required: [pqc_readiness_score, algorithm_ratios, inventory_table]

    Recommendation:
      type: object
      properties:
        priority_rank:
          type: integer
          description: Priority ranking of the recommendation.
        estimated_effort:
          type: string
          description: Estimated effort to resolve (e.g., "3 M/D").
        ai_recommendation:
          type: string
          description: AI-generated refactoring guidance (Markdown formatted).
      required: [priority_rank, estimated_effort, ai_recommendation]

    HeatmapNode:
      type: object
      properties:
        name:
          type: string
          description: Display name of the node.
        path:
          type: string
          description: Relative path of the node.
        type:
          type: string
          enum: [dir, file]
          description: Node type.
        risk_score:
          type: number
          format: float
          description: Risk score (0.0-1.0).
        children:
          type: array
          items:
            $ref: '#/components/schemas/HeatmapNode'
          description: Child nodes (directories only).
      required: [name, path, type, risk_score, children]
